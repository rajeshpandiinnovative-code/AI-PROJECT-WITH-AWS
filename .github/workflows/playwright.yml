name: Playwright

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef01"
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"
      GEMINI_API_KEY: "ci-placeholder-gemini-key-not-used-at-build"
      GOOGLE_CLOUD_VISION_API_KEY: "ci-placeholder-vision-not-used-at-build"
      MARKING_RUBRIC: "Placeholder marking rubric text for CI."
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"
      AUTH_URL: "http://127.0.0.1:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        run: npm run test:e2e
